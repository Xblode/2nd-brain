# RÃ¨gles de routage initiales â€” Ã  valider avant implÃ©mentation.
rules:
  - kind: IDEA
    destination: registry
    create_document_by_default: false
  - kind: HYPOTHESIS
    destination: registry
    document_when: structured_research
  - kind: DECISION
    destination: registry
    document_when: decision_log_is_useful
  - kind: REQUIREMENT
    destination: registry
    document_when: specification_is_useful
  - kind: FACT
    destination: registry_or_relevant_reference_document
  - kind: QUESTION
    destination: registry
    state_when: blocking
  - kind: PLAN
    destination: state_or_roadmap
  - kind: TASK
    destination: external_task_manager_or_registry
  - kind: REFERENCE
    destination: registry
    document_when: part_of_research
  - kind: INSIGHT
    destination: registry
    update_source_of_truth_when: it_changes_canonical_understanding
  - kind: ISSUE
    destination: registry
  - kind: NOTE
    destination: no_write_unless_durable
inbox:
  ai_write_access: forbidden
