  .cursor/skills/cadrer/SKILL.md: sync_shared
  .cursor/skills/build/SKILL.md: sync_shared
  .cursor/skills/go/SKILL.md: sync_shared
  .cursor/skills/statut/SKILL.md: sync_shared
  .cursor/skills/note/SKILL.md: sync_shared
  .cursor/skills/sync/SKILL.md: sync_shared
  .cursor/skills/spec/SKILL.md: sync_shared
  .cursor/skills/faire/SKILL.md: sync_shared
  .cursor/skills/ui/SKILL.md: sync_shared
  .cursor/skills/done/SKILL.md: sync_shared
  .cursor/skills/audit/SKILL.md: sync_shared
  .cursor/skills/fin/SKILL.md: sync_shared
  .cursor/skills/clickup/SKILL.md: sync_shared

# Jamais copiés — lus via brain_main_path (.second-brain.yaml)
# Pack web-starter : installé à la demande par /build (pas ce manifeste)
link_only_prefixes:
  - skills/
  - conventions/
  - integrations/
  - docs/
  - core/
  - mcp-server/
  - cli/
  - scripts/
  - adapters/
  - templates/

update:
  mode: propose_only
  never_overwrite_policies:
    - copy_once
  on_diverged_sync_shared: report_only
