# Taxonomie adoptée (DEC-006 / OPEN-001 résolu).
# Sérialisation des entrées : DEC-009 (JSONL, une ligne physique par objet).
# Contrat d'implémentation pour les entrées de registre.
status: adopted
decision: DEC-006
serialization_decision: DEC-009
entry_format: jsonl_one_object_per_physical_line
kinds:
  - fact
  - hypothesis
  - idea
  - question
  - decision
  - task
  - issue
  - reference
id_prefixes:
  fact: FACT-
  hypothesis: HYP-
  idea: IDEA-
  question: OPEN-
  decision: DEC-
  task: TASK-
  issue: ISSUE-
  reference: REF-
statuses:
  - proposed
  - accepted
  - rejected
  - deferred
  - active
  - blocked
  - resolved
  - settled
  - superseded
# Statuts typiques par kind (convention ; les invalides sont rejetés)
status_by_kind:
  decision: [proposed, accepted, rejected, deferred, settled, superseded]
  task: [proposed, accepted, rejected, deferred, active, blocked, resolved, superseded]
  issue: [proposed, accepted, rejected, deferred, active, blocked, resolved, superseded]
  question: [proposed, accepted, rejected, deferred, active, resolved, superseded]
  fact: [proposed, accepted, rejected, deferred, superseded]
  reference: [proposed, accepted, rejected, deferred, superseded]
  idea: [proposed, accepted, rejected, deferred, superseded]
  hypothesis: [proposed, accepted, rejected, deferred, superseded]
scopes:
  - system
  - project
  - component
certainty:
  - verified
  - likely
  - unknown
relations:
  - supports
  - contradicts
  - supersedes
  - derived_from
  - implements
  - related_to
  - blocks
  - duplicate_of
# Hors registre (pas d'entrées atomiques) : plans détaillés, notes de session, contenus Inbox.
# Non adoptés : requirement, plan, insight, note.
